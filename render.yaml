services:
  - type: web
    name: impactmatch-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SERVE_MEDIA
        value: "True"
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://spiffy-gingersnap-8d4ab2.netlify.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://spiffy-gingersnap-8d4ab2.netlify.app,https://back-production-e26b.up.railway.app"
