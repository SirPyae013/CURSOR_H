# If Railway is pointed at the whole repo, build Django only.
# Frontend is hosted on Netlify.

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["python -m pip install -r backend/requirements.txt"]

[start]
cmd = "cd backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
